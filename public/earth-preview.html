<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>3D 交互式地球仪预览</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'JetBrains Mono', monospace, sans-serif;
    }
    #globeViz {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .overlay {
      position: absolute;
      top: 30px;
      left: 30px;
      z-index: 10;
      pointer-events: none;
      color: #fff;
    }
    h1 {
      font-size: 2rem;
      margin: 0;
      letter-spacing: 3px;
      font-weight: 300;
      text-transform: uppercase;
    }
    p {
      margin: 10px 0 0 0;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
    }
    .controls-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 30px;
      pointer-events: none;
    }
    .hint-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    .hint-icon {
      width: 24px;
      height: 24px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      color: #fff;
      font-size: 1.2rem;
      letter-spacing: 2px;
      transition: opacity 0.5s;
    }
    .back-btn {
      position: absolute;
      top: 30px;
      right: 30px;
      z-index: 10;
      padding: 10px 20px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    
    /* Hover Tooltip (Styled for Globe.gl native tooltip) */
    .scene-tooltip {
      background: rgba(10, 10, 10, 0.85) !important;
      border: 1px solid rgba(255, 255, 255, 0.8) !important;
      color: #ffffff !important;
      font-size: 1.2rem !important;
      padding: 10px 15px !important;
      border-radius: 4px !important;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3) !important;
      letter-spacing: 1px !important;
      backdrop-filter: blur(4px) !important;
    }
  </style>
</head>
<body>
  <div class="loading" id="loader">INITIALIZING GEO DATA...</div>

  <div class="overlay">
    <h1>Global Nexus</h1>
    <p>Interactive Earth Prototype v4.0</p>
  </div>
  
  <a href="/" class="back-btn">RETURN TO REALITY</a>

  <div class="controls-hint">
    <div class="hint-item"><div class="hint-icon">👆</div> 拖拽旋转</div>
    <div class="hint-item"><div class="hint-icon">↕</div> 滚轮缩放</div>
    <div class="hint-item"><div class="hint-icon">🔍</div> 靠近显示悬停</div>
  </div>

  <div id="globeViz"></div>

  <!-- Force UMD to export to window instead of AMD/CommonJS -->
  <script>
    var define = undefined;
    var module = undefined;
    var exports = undefined;
  </script>

  <!-- Load Three.js and Globe.gl from LOCAL -->
  <script src="/three.min.js"></script>
  <script src="/globe.gl.min.js"></script>

  <script>
    const geoJsonUrl = '/countries.json';
    let currentBorderAlpha = 0;

    fetch(geoJsonUrl)
      .then(res => res.json())
      .then(countries => {
        
        const world = Globe()(document.getElementById('globeViz'))
          .globeImageUrl('/earth-blue-marble.jpg')
          .polygonsData(countries.features)
          .polygonAltitude(0.005)
          .polygonCapColor(() => 'rgba(255, 255, 255, 0.01)')
          .polygonSideColor(() => 'rgba(255, 255, 255, 0.01)')
          .polygonStrokeColor(() => `rgba(255, 255, 255, 1)`)
          .polygonLabel(({ properties: d }) => d.name);

        // Soften material reflection
        const globeMaterial = world.globeMaterial();
        globeMaterial.shininess = 2;
        globeMaterial.specular = new THREE.Color(0x050505);

        // Add ambient and soft directional light
        const scene = world.scene();
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.7);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);

        // Hover interaction state
        // Add a dedicated Highlight Group to the scene
        const highlightGroup = new THREE.Group();
        highlightGroup.scale.setScalar(1.015); // Extrude outwards by 1.5%
        scene.add(highlightGroup);
        
        // A single glowing material for the highlighted country
        const highlightMaterial = new THREE.MeshBasicMaterial({ 
          color: 0xffffff, 
          transparent: true, 
          opacity: 0.6, 
          side: THREE.DoubleSide,
          depthWrite: false
        });

        // Hover interaction state
        let hoverD = null;
        let debugDone = false;
        
        world.onPolygonHover((d) => {
          hoverD = d;
          
          // Clear previous highlight
          highlightGroup.clear();

          if (hoverD) {
            // DEBUG: dump entire scene graph once to understand structure
            if (!debugDone) {
              debugDone = true;
              const targetName = hoverD.properties.name;
              console.log('=== HOVER DEBUG ===');
              console.log('Looking for:', targetName);
              let found = 0;
              world.scene().traverse(obj => {
                // Log every object that has __data
                if (obj.__data) {
                  found++;
                  const dName = obj.__data.properties ? obj.__data.properties.name : '(no properties)';
                  const childMeshes = [];
                  obj.traverse(c => { if (c.isMesh) childMeshes.push(c.type + '|geo:' + !!c.geometry); });
                  console.log('  __data obj:', obj.type, '| name:', obj.name, '| __data.name:', dName, '| isMesh:', obj.isMesh, '| hasGeo:', !!obj.geometry, '| childMeshes:', childMeshes.length, childMeshes);
                }
              });
              console.log('Total __data objects found:', found);
              
              // Also log all mesh types in scene
              let meshCount = 0;
              world.scene().traverse(obj => {
                if (obj.isMesh) {
                  meshCount++;
                  if (meshCount <= 10) {
                    console.log('  Mesh:', obj.name, '| parent:', obj.parent ? obj.parent.type + '/' + obj.parent.name : 'none', '| has __data:', !!obj.__data, '| parentHas__data:', !!(obj.parent && obj.parent.__data));
                  }
                }
              });
              console.log('Total meshes in scene:', meshCount);
            }

            world.scene().traverse(obj => {
              if (obj.__data && obj.__data.properties && obj.__data.properties.name === hoverD.properties.name) {
                obj.traverse(child => {
                  if (child.isMesh && child.geometry) {
                    const highlightMesh = new THREE.Mesh(child.geometry, highlightMaterial);
                    highlightMesh.position.copy(child.position);
                    highlightMesh.rotation.copy(child.rotation);
                    highlightMesh.scale.copy(child.scale);
                    highlightGroup.add(highlightMesh);
                  }
                });
              }
            });
            
            console.log('Highlight meshes added:', highlightGroup.children.length);
          }
        });

        // Hide loader
        const loader = document.getElementById('loader');
        if (loader) {
          loader.style.opacity = 0;
          setTimeout(() => loader.remove(), 500);
        }

        // Add rotation animation and dynamic border fade based on zoom
        world.controls().enablePan = false;
        world.controls().enableDamping = true;
        world.controls().dampingFactor = 0.05;
        world.controls().minDistance = 120;
        world.controls().maxDistance = 800;
        world.controls().autoRotate = true;
        const baseRotateSpeed = 0.8;
        world.controls().autoRotateSpeed = baseRotateSpeed;

        (function checkZoom() {
          requestAnimationFrame(checkZoom);
          
          const camera = world.camera();
          const dist = camera.position.distanceTo(new THREE.Vector3(0,0,0));
          
          // --- Dynamic Rotation Speed ---
          // dist is between 120 (min) and 800 (max)
          // Speed drops quadratically when zooming in for a cinematic feel
          const normalizedDist = Math.max(0, Math.min(1, (dist - 120) / (800 - 120)));
          world.controls().autoRotateSpeed = baseRotateSpeed * (0.05 + 0.95 * Math.pow(normalizedDist, 1.5));

          // --- Dynamic Border Fade ---
          let targetAlpha = 0;
          if (dist < 280) {
            targetAlpha = (280 - dist) / 130; 
            if (targetAlpha > 1.0) targetAlpha = 1.0; 
          }

          if (Math.abs(currentBorderAlpha - targetAlpha) > 0.01) {
            currentBorderAlpha += (targetAlpha - currentBorderAlpha) * 0.1;
            
            // Fast material update instead of geometry rebuild!
            world.scene().traverse(obj => {
              if ((obj.type === 'Line' || obj.type === 'LineSegments') && obj.material) {
                obj.material.transparent = true;
                obj.material.opacity = currentBorderAlpha;
                // Since our stroke accessor returns rgba(255,255,255,1), we just scale it by opacity
              }
            });
          }
        })();
      })
      .catch(err => {
        console.error("Initialization error:", err);
        const loader = document.getElementById('loader');
        if (loader) {
          loader.style.color = 'red';
          loader.innerHTML = "FATAL ERROR: " + err.message + "<br/>Check console.";
        }
      });
  </script>
</body>
</html>
