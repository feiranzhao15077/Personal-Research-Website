title: 歼-20
designation: J-20
summary: 鸭翼平放，起落架落下，换个角度看看歼-20。
software: Blender
renderer: Cycles
resolution: 1600 × 1000
order: 2
model3d:
  desktop: /models/j20/j20.glb
  mobile: /models/j20/j20-lite.glb
  preview: /models/j20/j20-preview.glb
cover: ../../assets/models/j20/j20-cover.png
spaceCover: ../../assets/models/j20/j20-cover.png
views:
  - id: front
    label: 前侧全景
    caption: 平放的鸭翼、伸出的起落架，还有完整的机身轮廓。
    alt: 歼-20的前侧全景，展示灰色迷彩、平放鸭翼、关闭的座舱盖和起落架
