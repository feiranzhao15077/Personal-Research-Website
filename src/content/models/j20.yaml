  - id: top
    label: 俯视布局
    caption: 鸭翼与主翼，在俯视中展开。
    alt: 歼-20的俯视渲染图，展示鸭翼、主翼和尾部布局
    image: ../../assets/models/j20/j20-top.png
  - id: rear
    label: 后侧视角
    caption: 换到后侧，看看双垂尾与尾部喷口。
    alt: 歼-20的后侧渲染图，展示双垂尾、机翼及发动机喷口
